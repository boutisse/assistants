# Déploiement « Odoo Boutisse – lecture »
# fly launch --config fly.lecture.toml --no-deploy  puis  fly deploy --config fly.lecture.toml
# Secrets (jamais dans ce fichier) :
#   fly secrets set --config fly.lecture.toml MCP_ENCRYPTION_KEY=$(openssl rand -base64 32) MCP_ADMIN_PASSWORD=... ODOO_USERNAME=... ODOO_API_KEY=...
app = "boutisse-odoo-lecture"          # à adapter
primary_region = "cdg"                 # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  BOUTISSE_PROFIL = "lecture"
  ODOO_URL = "https://boutisse.odoo.com"
  ODOO_DB = "boutisse"                 # À VÉRIFIER : nom exact de la base (Odoo ▸ /web/database/selector ou Gregory)
  MCP_PUBLIC_URL = "https://boutisse-odoo-lecture.fly.dev"

[[mounts]]
  source = "odoo_lecture_users"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
